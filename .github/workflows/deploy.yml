name: 部署

on:
  workflow_run:
    workflows: ['构建并推送镜像']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到 Altare
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      ALTARE_TOKEN: ${{ secrets.ALTR_TOKEN }}
      APP: ${{ vars.ALTR_APP_NAME }}
    steps:
      - id: check
        name: 检查配置
        run: |
          if [ -z "${ALTARE_TOKEN:-}" ] || [ -z "${APP:-}" ]; then
            echo "::notice::未配置 Secrets.ALTR_TOKEN 或 Variables.ALTR_APP_NAME，跳过自动部署。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Altare CLI
        if: steps.check.outputs.configured == 'true'
        run: |
          curl -fsSL https://altare.gg/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 创建或更新应用
        if: steps.check.outputs.configured == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wepov:latest"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if altr docker info "$APP" >/dev/null 2>&1; then
            echo "应用已存在，更新镜像"
            altr docker set "$APP" --image "$IMAGE" --port 3000
            altr docker redeploy "$APP"
          else
            echo "创建应用 $APP"
            altr docker create "$APP" "$IMAGE" --port 3000 --memory 512 --cpu 100
          fi
