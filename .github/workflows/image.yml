name: 构建并推送镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wepov

jobs:
  image:
    name: 构建容器镜像
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Altare 以匿名方式拉取镜像，因此包必须公开。GITHUB_TOKEN 对关联到
      # 本仓库的包有 packages:write 权限，可以直接改可见性。
      - name: 公开镜像包
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 包归属用户命名空间；工作流令牌对关联到本仓库的包有管理权限。
          gh api -X PATCH "users/${GITHUB_REPOSITORY_OWNER}/packages/container/wepov" -f visibility=public >/dev/null \
            && echo "镜像包已设为公开" \
            || echo "::warning::镜像包可见性设置失败，可稍后在 GitHub 包设置中手动公开"
